name: Code coverage

on: [pull_request]

env:
  BUILD_FOLDER: build
  EXAMPLES_FOLDER: examples

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          conda-solver: libmamba
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict
          activate-environment: biorbd_eigen
          environment-file: environment_eigen.yml
        
      - name: Print conda info
        run: | 
          conda info
          conda list
  
      - name: Prepare build dependencies
        run: | 
          conda install --yes git pkgconfig "lcov=1.16" -c conda-forge
          conda list
          git submodule update --init --recursive

      - name: Perform code coverage 
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH="$CONDA_PREFIX"
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake -DCMAKE_INSTALL_PREFIX="$CONDA_ENV_PATH" -DCMAKE_PREFIX_PATH="$CONDA_ENV_PATH" -DCMAKE_BUILD_TYPE=Coverage -DBUILD_TESTS=ON -DBUILD_EXAMPLE=OFF -DMODULE_ACTUATORS=ON -DMODULE_MUSCLES=ON -DMODULE_PASSIVE_TORQUES=ON -DMODULE_KALMAN=ON ..
          cp -r test/models/ .
          make biorbd_eigen_coverage -j${{ steps.cpu-cores.outputs.count }}
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info
          bash <(curl -s https://codecov.io/bash) || echo "Codecov did not collect coverage reports"
          cd $BIORBD_FOLDER
