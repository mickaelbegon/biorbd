name: Run the Eigen tests

on: [pull_request]

env:
  BUILD_FOLDER: build
  EXAMPLES_FOLDER: examples

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-64
          - os: macos-15-intel
            label: osx-intel
            # R2025b is the final MATLAB release for Intel Macs.
            matlab_release: R2025b
          - os: windows-2022
            label: win-64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          conda-solver: libmamba
          channels: conda-forge
          conda-remove-defaults: true
          channel-priority: strict
          activate-environment: biorbd_eigen
          environment-file: environment_eigen.yml
  
      - name: Print conda info
        run: | 
          conda info
          conda list

      - name: Prepare build dependencies
        run: | 
          conda list
          git submodule update --init --recursive

      - name: Install MATLAB on WINDOWS, LINUX and MACOS-Intel
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab_release || 'latest' }}
          cache: true

      - name: Build biorbd UNIX
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH="$CONDA_PREFIX"
          mkdir -p $BIORBD_FOLDER/$BUILD_FOLDER
          cd $BIORBD_FOLDER/$BUILD_FOLDER
          cmake -DCMAKE_INSTALL_PREFIX="$CONDA_ENV_PATH" -DCMAKE_PREFIX_PATH="$CONDA_ENV_PATH" -DMATH_LIBRARY_BACKEND="Eigen3" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMODULE_ACTUATORS=ON -DMODULE_KALMAN=ON -DMODULE_PASSIVE_TORQUES=ON -DMODULE_MUSCLES=ON -DBUILD_EXAMPLE=ON -DBINDER_C=ON -DBINDER_PYTHON3=ON -DBINDER_MATLAB=ON -DMatlab_biorbd_eigen_INSTALL_DIR=$HOME ..
          make install -j${{ steps.cpu-cores.outputs.count }}
          cd $BIORBD_FOLDER
        if: matrix.label != 'win-64'

      - name: Run tests UNIX
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test
          ./biorbd_eigen_tests
          cd $BIORBD_FOLDER
        if: matrix.label != 'win-64'

      - name: Run c binder tests UNIX
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test/binding/c
          ./biorbd_eigen_tests_binding_c
          cd $BIORBD_FOLDER
        if: matrix.label != 'win-64'

      - name: Test installed version on UNIX
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH="$CONDA_PREFIX"
          cd $BIORBD_FOLDER/$EXAMPLES_FOLDER/cpp_eigen_installed
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake -DCMAKE_INSTALL_PREFIX="$CONDA_ENV_PATH" -DCMAKE_PREFIX_PATH="$CONDA_ENV_PATH" -DCMAKE_BUILD_TYPE=Release ..
          make -j${{ steps.cpu-cores.outputs.count }}
          ./forwardDynamicsExample
          cd $BIORBD_FOLDER
        if: matrix.label != 'win-64'
  
      - name: Build biorbd WINDOWS
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH="$CONDA_PREFIX"
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake -G"Visual Studio 17 2022" -Ax64 -DCMAKE_INSTALL_PREFIX="$CONDA_ENV_PATH" -DCMAKE_PREFIX_PATH="$CONDA_ENV_PATH" -DMATH_LIBRARY_BACKEND="Eigen3" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMODULE_ACTUATORS=ON -DMODULE_KALMAN=ON -DMODULE_MUSCLES=ON -DBUILD_EXAMPLE=ON -DBINDER_C=ON -DBINDER_PYTHON3=ON -DBINDER_MATLAB=ON -DMatlab_biorbd_eigen_INSTALL_DIR=$HOME ..
          cmake --build . --config Release --target install -j${{ steps.cpu-cores.outputs.count }}
          cd $BIORBD_FOLDER
        if: matrix.label == 'win-64'

      - name: Run tests WINDOWS
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test
          cp Release/biorbd_eigen_tests.exe .
          ./biorbd_eigen_tests.exe
          cd $BIORBD_FOLDER
        if: matrix.label == 'win-64'

      - name: Run c binder tests WINDOWS
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test/binding/c
          cp Release/biorbd_eigen_tests_binding_c.exe .
          ./biorbd_eigen_tests_binding_c.exe
          cd $BIORBD_FOLDER
        if: matrix.label == 'win-64'

      - name: Test installed version on WINDOWS
        run: |
          BIORBD_FOLDER=`pwd`
          CONDA_ENV_PATH="$CONDA_PREFIX"
          cd $BIORBD_FOLDER/$EXAMPLES_FOLDER/cpp_eigen_installed
          mkdir -p $BUILD_FOLDER
          cd $BUILD_FOLDER
          cmake -G"Visual Studio 17 2022" -Ax64 -DCMAKE_INSTALL_PREFIX="$CONDA_ENV_PATH" -DCMAKE_PREFIX_PATH="$CONDA_ENV_PATH" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release -j${{ steps.cpu-cores.outputs.count }}
          cp Release/forwardDynamicsExample.exe .
          ./forwardDynamicsExample.exe
          cd $BIORBD_FOLDER
        if: matrix.label == 'win-64'

      - name: Run python binder tests 
        run: |
          BIORBD_FOLDER=`pwd`
          cd $BIORBD_FOLDER/$BUILD_FOLDER/test/binding/Python3
          python -m pytest .
          cd $BIORBD_FOLDER

      - name: Test installed version of python
        run: | 
          BIORBD_FOLDER=`pwd`
          cd
          python -c "import biorbd"
          cd $BIORBD_FOLDER

      - name: Run MATLAB binder tests
        run: |
          # We cannot run the tests as we do not have a license.
          # At least we know it compiles
